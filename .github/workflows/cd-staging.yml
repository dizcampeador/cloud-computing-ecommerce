name: CD Staging

# NOTA: el lab solo tiene una instancia EC2 disponible. "Staging" es simulado:
# mismo servidor, mismo WP_PATH que produccion (no hay entorno separado real).
# Limitacion documentada en _specs/04-infra-branching-cicd.md.
#
# Runner self-hosted (registrado en la propia EC2) en vez de ubuntu-latest:
# el SG solo permite SSH desde la IP local, no desde runners de GitHub, asi
# que el deploy corre localmente en el servidor en vez de saltar por SSH.

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: [self-hosted, ec2]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy theme (local)
        env:
          WP_PATH: ${{ secrets.STAGING_WP_PATH }}
        run: bash infra/deploy-theme-local.sh
