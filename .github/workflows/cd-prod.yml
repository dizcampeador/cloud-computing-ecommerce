name: CD Production

on:
  push:
    branches: [main]

# Runner self-hosted (registrado en la propia EC2) en vez de ubuntu-latest:
# ver nota equivalente en cd-staging.yml.

jobs:
  deploy:
    runs-on: [self-hosted, ec2]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy theme (local)
        env:
          WP_PATH: ${{ secrets.PROD_WP_PATH }}
        run: bash infra/deploy-theme-local.sh
